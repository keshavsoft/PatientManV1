<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #f7fbff);
            color: #1f2937;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .12);
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .header img {
            width: 56px;
            margin-bottom: 12px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .field {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #d6deea;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        /* Sex bubble buttons */
        .sex-group {
            display: flex;
            gap: 10px;
        }

        .sex-group input {
            display: none;
        }

        .sex-group label {
            flex: 1;
            height: 46px;
            border-radius: 999px;
            border: 1px solid #d6deea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
            background: #f8fafc;
        }

        .sex-group input:checked+label {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            box-shadow: 0 6px 16px rgba(37, 99, 235, .35);
        }

        /* Button */
        button {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, .35);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <div class="header">
                <img src="https://cdn-icons-png.flaticon.com/512/2966/2966487.png" alt="">
                <h2>Patient Registration</h2>
            </div>

            <div class="field">
                <input placeholder="Patient ID">
            </div>

            <div class="field">
                <input placeholder="Patient Name">
            </div>

            <div class="field">
                <input type="number" placeholder="Age">
            </div>

            <div class="field sex-group">
                <input type="radio" id="male" name="sex">
                <label for="male">Male</label>

                <input type="radio" id="female" name="sex">
                <label for="female">Female</label>

                <input type="radio" id="other" name="sex">
                <label for="other">Other</label>
            </div>

            <div class="field">
                <input placeholder="City">
            </div>

            <div class="field">
                <input type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Mobile Number">
            </div>

            <button>Register</button>

        </div>
    </div>
</body>

</html>
