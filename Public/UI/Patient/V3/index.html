<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="76x76" href="assets/img/apple-icon.png">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Get Shit Done Bootstrap Wizard by Creative Tim</title>

    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />
    <meta name="viewport" content="width=device-width" />

    <!--     Fonts and icons     -->
    <link href="http://netdna.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.css" rel="stylesheet">

    <!-- CSS Files -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/gsdk-bootstrap-wizard.css" rel="stylesheet" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link href="assets/css/demo.css" rel="stylesheet" />

    <style>
        /* REMOVE BLACK FOCUS BORDER (INPUTS + BUTTONS) */
        #loginDialog input:focus,
        #loginDialog button:focus,
        #loginDialog .btn:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: #ddd !important;
        }

        #loginDialog input:focus {
            border-color: #ff9800 !important;
            background: #fff;
        }

        #loginDialog button {
            outline: none !important;
            box-shadow: none !important;
        }

        #loginDialog .btn-cancel {
            border: 1px solid #ddd !important;
        }

        #loginDialog .btn-login {
            border: none !important;
        }

        /* ===== LOGIN OVERLAY ===== */
        dialog#loginDialog {
            border: none;
            padding: 0;
            background: transparent;
        }

        dialog#loginDialog::backdrop {
            background: rgba(0, 0, 0, .45);
        }

        .login-card {
            width: 360px;
            background: #fff;
            border-radius: 6px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
            font-family: 'Inter', sans-serif;
        }

        /* Typography aligned with wizard */
        .login-card h3 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }

        .login-card p {
            margin: 0 0 20px;
            font-size: 14px;
            color: #888;
        }

        /* Inputs like Patient V1 */
        .login-card input {
            width: 100%;
            height: 42px;
            padding: 6px 12px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Buttons aligned */
        .login-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
            padding: 8px 18px;
            border-radius: 4px;
        }

        .btn-login {
            background: #ff9800;
            /* SAME as NEXT */
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <dialog id="loginDialog">
        <form class="login-card" method="dialog">
            <h3>Login</h3>
            <p>Please authenticate to continue</p>

            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <div class="login-actions">
                <button class="btn-cancel" value="cancel">Cancel</button>
                <button class="btn-login" id="ModalLoginButtonId">Login</button>
            </div>
        </form>
    </dialog>

    <div class="image-container set-full-height" style="background-image: url('assets/img/wizard.jpg')">
        <!--   Big container   -->
        <div class="container">
            <div class="row">
                <div class="col-sm-8 col-sm-offset-2">

                    <!--      Wizard container        -->
                    <div class="wizard-container" style="padding-top: 30px;">

                        <div class="card wizard-card" data-color="orange" id="wizardProfile">
                            <form onsubmit="return false;" id="FormId">
                                <!--        You can switch ' data-color="orange" '  with one of the next bright colors: "blue", "green", "orange", "red"          -->

                                <div class="wizard-header">
                                    <h3>
                                        <b>Patient</b> registration<br>
                                        <small>This information will let us know more about you.</small>
                                    </h3>
                                </div>

                                <div class="wizard-navigation">
                                    <ul>
                                        <li><a href="#about" data-toggle="tab">About</a></li>
                                        <li><a href="#account" data-toggle="tab">Account</a></li>
                                        <li><a href="#address" data-toggle="tab">Address</a></li>
                                    </ul>

                                </div>

                                <div class="tab-content">
                                    <div class="tab-pane" id="about">
                                        <div class="row">
                                            <div class="col-sm-4 col-sm-offset-1">
                                                <div class="picture-container">
                                                    <div class="picture">
                                                        <img src="assets/img/default-avatar.png" class="picture-src"
                                                            id="wizardPicturePreview" title="" />
                                                        <input type="file" id="wizard-picture">
                                                    </div>
                                                    <h6>Choose Picture</h6>
                                                </div>
                                            </div>
                                            <div class="col-sm-6">
                                                <div class="form-group">
                                                    <label>Name <small>(required)</small></label>
                                                    <input name="PatientName" type="text" class="form-control"
                                                        placeholder="Andrew...">
                                                </div>
                                                <div class="form-group">
                                                    <label>Mobile <small>(required)</small></label>
                                                    <input name="PatientMobile" type="text" class="form-control"
                                                        placeholder="Smith...">
                                                </div>
                                            </div>
                                            <div class="col-sm-10 col-sm-offset-1">
                                                <div class="form-group">
                                                    <label>City <small>(required)</small></label>
                                                    <input name="PatientCity" type="text" class="form-control"
                                                        placeholder="andrew@creative-tim.com">
                                                </div>
                                            </div>
                                            <div class="col-sm-10 col-sm-offset-1">
                                                <button id="SaveButtonId"
                                                    class='btn btn-fill btn-success btn-wd btn-sm'>Save</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane" id="account">
                                        <h4 class="info-text"> What are you doing? (checkboxes) </h4>
                                        <div class="row">

                                            <div class="col-sm-10 col-sm-offset-1">
                                                <div class="col-sm-4">
                                                    <div class="choice" data-toggle="wizard-checkbox">
                                                        <input type="checkbox" name="jobb" value="Design">
                                                        <div class="icon">
                                                            <i class="fa fa-pencil"></i>
                                                        </div>
                                                        <h6>Design</h6>
                                                    </div>
                                                </div>
                                                <div class="col-sm-4">
                                                    <div class="choice" data-toggle="wizard-checkbox">
                                                        <input type="checkbox" name="jobb" value="Code">
                                                        <div class="icon">
                                                            <i class="fa fa-terminal"></i>
                                                        </div>
                                                        <h6>Code</h6>
                                                    </div>

                                                </div>
                                                <div class="col-sm-4">
                                                    <div class="choice" data-toggle="wizard-checkbox">
                                                        <input type="checkbox" name="jobb" value="Develop">
                                                        <div class="icon">
                                                            <i class="fa fa-laptop"></i>
                                                        </div>
                                                        <h6>Develop</h6>
                                                    </div>

                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                    <div class="tab-pane" id="address">
                                        <div class="row">
                                            <div class="col-sm-12">
                                                <h4 class="info-text"> Are you living in a nice area? </h4>
                                            </div>
                                            <div class="col-sm-7 col-sm-offset-1">
                                                <div class="form-group">
                                                    <label>Street Name</label>
                                                    <input type="text" class="form-control" placeholder="5h Avenue">
                                                </div>
                                            </div>
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Street Number</label>
                                                    <input type="text" class="form-control" placeholder="242">
                                                </div>
                                            </div>
                                            <div class="col-sm-5 col-sm-offset-1">
                                                <div class="form-group">
                                                    <label>City</label>
                                                    <input type="text" class="form-control" placeholder="New York...">
                                                </div>
                                            </div>
                                            <div class="col-sm-5">
                                                <div class="form-group">
                                                    <label>Country</label><br>
                                                    <select name="country" class="form-control">
                                                        <option value="India"> India </option>
                                                        <option value="Albania"> Albania </option>
                                                        <option value="Algeria"> Algeria </option>
                                                        <option value="American Samoa"> American Samoa </option>
                                                        <option value="Andorra"> Andorra </option>
                                                        <option value="Angola"> Angola </option>
                                                        <option value="Anguilla"> Anguilla </option>
                                                        <option value="Antarctica"> Antarctica </option>
                                                        <option value="...">...</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="wizard-footer height-wizard">
                                    <div class="pull-right">
                                        <input type='button' class='btn btn-next btn-fill btn-warning btn-wd btn-sm'
                                            name='next' value='Next' />

                                        <input type='button' class='btn btn-finish btn-fill btn-warning btn-wd btn-sm'
                                            name='finish' value='Finish' />

                                    </div>

                                    <div class="pull-left">
                                        <input type='button' class='btn btn-previous btn-fill btn-default btn-wd btn-sm'
                                            name='previous' value='Previous' />
                                    </div>
                                    <div class="clearfix"></div>
                                </div>

                            </form>
                        </div>
                    </div> <!-- wizard container -->
                </div>
            </div><!-- end row -->
        </div> <!--  big container -->
    </div>

</body>

<!--   Core JS Files   -->
<script src="assets/js/jquery-2.2.4.min.js" type="text/javascript"></script>
<script src="assets/js/bootstrap.min.js" type="text/javascript"></script>
<script src="assets/js/jquery.bootstrap.wizard.js" type="text/javascript"></script>

<!--  Plugin for the Wizard -->
<script src="assets/js/gsdk-bootstrap-wizard.js"></script>

<!--  More information about jquery.validate here: http://jqueryvalidation.org/	 -->
<script src="assets/js/jquery.validate.min.js"></script>

<script src="./Js/Index/entryFile.js" type="module"></script>
<script>
    const dlg = document.getElementById("loginDialog");
    dlg.showModal(); // call when needed
</script>

</html>
